name: Publish CManga Release

on:
  workflow_run:
    workflows:
      - "Build Android APK"
      - "Build Windows"
      - "Build Linux"
      - "Build macOS"
      - "Build iOS"
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: cmanga-release-publication
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Read CManga release version
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)
          test -n "$VERSION"
          echo "RELEASE_TAG=cmanga-v$VERSION" >> "$GITHUB_ENV"

      - name: Select CManga platform artifact
        id: artifact
        env:
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          case "$WORKFLOW" in
            "Build Android APK") PLATFORM=android ;;
            "Build Windows") PLATFORM=windows ;;
            "Build Linux") PLATFORM=linux ;;
            "Build macOS") PLATFORM=macos ;;
            "Build iOS") PLATFORM=ios ;;
            *) echo "::error::Unknown build workflow"; exit 1 ;;
          esac
          echo "name=cmanga-release-$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Download artifact from the successful CManga build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish current repository assets
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mapfile -t FILES < <(find artifacts -type f)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No CManga release assets found"
            exit 1
          fi
          for FILE in "${FILES[@]}"; do
            case "$(basename "$FILE")" in
              cmanga-*.apk|cmanga-*.ipa|cmanga-*.zip) ;;
              *) echo "::error::Refusing non-CManga release asset: $FILE"; exit 1 ;;
            esac
          done
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --repo "$GH_REPO" \
              --title "CManga ${RELEASE_TAG#cmanga-v}" \
              --notes "CManga builds from $SOURCE_SHA. The iOS IPA is unsigned and requires your own signing. Native AI is supported on Windows, Android, macOS and iOS; Linux is a reader-only build." \
              --target "$SOURCE_SHA"
          fi
