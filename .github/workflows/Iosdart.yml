name: Build iOS
on:
  push:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore pinned native Metal runtime
        id: metal-cache
        uses: actions/cache/restore@v4
        with:
          path: build/apple-ort
          key: apple-ort-ios-${{ runner.arch }}-${{ hashFiles('native/apple/build_ort_metal.py', 'native/apple/ort-metal.patch', 'native/apple/CMangaOnnxRuntime.podspec') }}
          restore-keys: apple-ort-ios-${{ runner.arch }}-

      - name: Build device and simulator Metal runtime slices
        run: python3 native/apple/build_ort_metal.py --platform ios

      - name: Save completed native Metal runtime
        if: steps.metal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/apple-ort
          key: ${{ steps.metal-cache.outputs.cache-primary-key }}
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS simulator native integration
        run: flutter build ios --simulator --debug --dart-define=CMANGA_REPOSITORY=${{ github.repository }}
        
      - name: Build iOS (No Signing)
        run: flutter build ios --release --no-codesign --dart-define=CMANGA_REPOSITORY=${{ github.repository }}
        
      - name: Create Payload Directory
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r "../../cmanga-ios-${VERSION}.ipa" Payload
          
      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: cmanga-release-ios
          path: build/cmanga-ios-*.ipa
          if-no-files-found: error
